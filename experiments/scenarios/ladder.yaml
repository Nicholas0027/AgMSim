# One city in which every level of a private car has something to do. Two banks joined by three
# bridges; almost everybody crosses west to east, so the bridges jam.
#   L1 re-routing:   the southern bridge is slowed by an incident for half an hour
#   L2 preferences:  the middle bridge, the most direct one, costs a charge; the other two are free
#   L3 transfers:    a bus line crosses the northern bridge in its own lane
#   L4 charging:     some cars start with too little charge; the station on everybody's way has one charger
# Every other agent is passive (L0), so that what changes is the cars' doing.
name: exp_ladder
description: Three bridges, a charge on one, an incident on another, a bus lane on the third, scarce charging.
simulation: {time_step_seconds: 2, duration_seconds: 9000, seed: 1}
network:
  type: bridge
  rows: 5
  cols: 4
  block_m: 400
  speed_mps: 10
  capacity_scale: 0.1
  params: {gap_m: 1200, bridge_rows: [0, 2, 4]}
demand:
  pattern: hotspots
  end_seconds: 2100
  min_trip_m: 2000
  params:
    background_share: 0.05
    origins: {0: 1, 1: 1, 2: 1, 4: 1, 5: 1, 6: 1, 8: 1, 9: 1, 10: 1, 12: 1, 13: 1, 14: 1, 16: 1, 17: 1, 18: 1}
    destinations: {21: 1, 22: 1, 23: 1, 25: 1, 26: 1, 27: 1, 29: 1, 30: 1, 31: 1, 33: 1, 34: 1, 35: 1, 37: 1, 38: 1, 39: 1}
agents:
  traveler: {count: 240, car_ownership: 1.0, non_llm_policy: utility, agency: L0, walk: false}
  vehicle:
    non_llm_policy: algorithm
    policy_params: {top_up_below_pct: 0}     # a car charges when it has to, not on its own while parked
    agency: L0
    battery: {capacity_kwh: 5, consumption_kwh_per_km: 0.18, initial_soc_min: 0.1, initial_soc_max: 0.8, target_soc: 0.8}
  bus:
    non_llm_policy: rule
    agency: L0
    max_access_m: 900
    lines: [{id: X, stops: [2, 3, 20, 21, 25, 29, 28, 11, 10, 6], buses: 5, capacity: 45}]
  evcs:
    non_llm_policy: algorithm
    agency: L0
    stations:
      - {id: C, node: 10, chargers: 1, power_kw: 30}
      - {id: N, node: 1, chargers: 2, power_kw: 30}
      - {id: S, node: 17, chargers: 2, power_kw: 30}
  operator: {enabled: true, agency: L0, cordon_center: 28, cordon_radius_m: 100, initial_toll: 1.0, initial_bus_priority: true}
interventions:
  - {type: link_condition, at_seconds: 600, until_seconds: 2400, links: [[19, 36]], factor: 0.15}
record: {dir: null}
