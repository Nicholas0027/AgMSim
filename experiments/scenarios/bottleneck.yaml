# E4: two banks joined by two bridges; almost everybody crosses west to east, so the bridges jam.
# A bus line crosses the northern bridge in its own lane (transit priority is permanently on).
name: exp_bottleneck
description: Bridge bottleneck with a bus lane; can vehicles talk their owners into park-and-ride?
simulation: {time_step_seconds: 2, duration_seconds: 7200, seed: 1}
network:
  type: bridge
  rows: 4
  cols: 4
  block_m: 400
  speed_mps: 10
  capacity_scale: 0.1
  params: {gap_m: 1200, bridge_rows: [1, 2]}
demand:
  pattern: hotspots
  end_seconds: 2100
  min_trip_m: 2000
  params:
    background_share: 0.05
    origins: {0: 1, 1: 1, 4: 1, 5: 1, 8: 1, 9: 1, 12: 1, 13: 1, 2: 1, 6: 1, 10: 1, 14: 1}
    destinations: {17: 1, 18: 1, 19: 1, 21: 1, 22: 1, 23: 1, 25: 1, 26: 1, 27: 1, 29: 1, 30: 1, 31: 1}
agents:
  traveler: {count: 220, car_ownership: 1.0, non_llm_policy: utility, agency: L0, walk: false}
  vehicle: {non_llm_policy: algorithm, agency: L2}
  bus:
    non_llm_policy: rule
    agency: L0
    max_access_m: 900
    lines: [{id: X, stops: [6, 7, 20, 21, 22, 26, 25, 24, 11, 10], buses: 5, capacity: 45}]
  operator: {enabled: true, agency: L0, initial_bus_priority: true}
record: {dir: null}
